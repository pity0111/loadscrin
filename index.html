<!DOCTYPE html>
<html>
<head>
<title>SpiritRP</title>
<link rel="stylesheet" href="sleek.css">
<style>

/* Убираем фоновую картинку */
body {
  background-image: none !important;
  background-color: #000 !important;
}

@font-face {
  font-family: 'vksans';
  src: url('fonts/silkscreen_rus.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
.content {
  background-color: rgba(0, 0, 0, 0.5);
  padding: 20px;
  border-radius: 10px;
}

h1 {
  text-align: center;
}

p {
  line-height: 1.6;
}

/* ═══════════════════════════════════════════════
   НИЖНЯЯ ПОЛОСА ЗАГРУЗКИ
═══════════════════════════════════════════════ */
#load-bar-wrap {
  position: fixed;
  left: 0; bottom: 0;
  width: 75%; /* чтобы не залезать под плашку GMod справа */
  z-index: 1001;
  padding: 0 0 26px 6vw;
  box-sizing: border-box;
  font-family: 'vksans', monospace;
  pointer-events: none;
}

#load-bar-wrap .lb-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 10px;
  font-size: 18px;
}

#load-status {
  color: #ffe4c9;
  text-shadow:
    0 0 10px rgba(255, 120, 30, 0.55),
    0 0 22px rgba(159, 64, 221, 0.4);
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  max-width: 80%;
}

#load-percent {
  font-size: 22px;
  color: #ff9f1c;
  text-shadow:
    0 0 12px rgba(255, 130, 40, 0.9),
    0 0 26px rgba(159, 64, 221, 0.5);
}

#load-bar {
  width: 100%;
  height: 10px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 130, 40, 0.45);
  border-radius: 6px;
  overflow: hidden;
  box-shadow:
    0 0 20px rgba(255, 110, 20, 0.25),
    0 0 32px rgba(120, 40, 200, 0.22),
    inset 0 0 12px rgba(0, 0, 0, 0.5);
}

#loading-progress {
  height: 100%;
  width: 0%;
  border-radius: 6px;
  background: linear-gradient(90deg, #ff6b1a, #ff9f1c, #c084fc);
  box-shadow:
    0 0 14px rgba(255, 120, 30, 0.9),
    0 0 28px rgba(159, 64, 221, 0.55);
  transition: width 0.4s ease;
}

/* ── Холст искр ── */
#sparks {
  position: fixed;
  top: 0; left: 0;
  pointer-events: none;
  z-index: 998;
}

#image-container {
  position: absolute;
  width: 20vw;
  height: 20vw;
  max-width: 300px;
  max-height: 300px;
  top: 0;
  left: 0;
  bottom: 0;
  right: 0;
  margin: auto;
}

#image-container img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  position: absolute;
  top: 0;
  left: 0;
  filter:
    drop-shadow(0 0 18px rgba(255, 120, 30, 0.45))
    drop-shadow(0 0 45px rgba(159, 64, 221, 0.3));
}

/* ═══════════════════════════════════════════════
   ПЛАШКА ИГРОКА — правый верхний угол
═══════════════════════════════════════════════ */
#player-card {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 1000;
  display: none;
  flex-direction: column;
  gap: 0;
  width: 300px;

  background: linear-gradient(150deg,
    rgba(30, 10, 8, 0.88) 0%,
    rgba(25, 8, 55, 0.84) 100%
  );
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 130, 40, 0.55);
  border-radius: 16px;
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.5),
    0 8px 32px rgba(0,0,0,0.6),
    0 0 30px rgba(255, 110, 20, 0.18),
    0 0 30px rgba(120, 40, 200, 0.22),
    inset 0 1px 0 rgba(255,255,255,0.07);
  animation: cardAppear 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
}

@keyframes cardAppear {
  from { opacity: 0; transform: translateX(40px) scale(0.94); }
  to   { opacity: 1; transform: translateX(0)    scale(1);    }
}

/* ── Верхняя секция: аватар + ник + ранг ── */
#player-card .pc-top {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 18px 14px 16px;
  background: rgba(255,255,255,0.03);
}

#player-card .pc-avatar {
  position: relative;
  flex-shrink: 0;
}
#player-card .pc-avatar img {
  width: 68px;
  height: 68px;
  border-radius: 12px;
  object-fit: cover;
  display: block;
  border: 2px solid rgba(255, 130, 40, 0.7);
  box-shadow: 0 0 16px rgba(255, 120, 30, 0.4);
}
#player-card .pc-online-dot {
  position: absolute;
  bottom: -3px; right: -3px;
  width: 13px; height: 13px;
  background: #4cde6f;
  border-radius: 50%;
  border: 2px solid rgba(8, 3, 22, 0.95);
  box-shadow: 0 0 8px rgba(76, 222, 111, 0.8);
  animation: pulseDot 2s ease-in-out infinite;
}
@keyframes pulseDot {
  0%,100% { box-shadow: 0 0 6px rgba(76,222,111,0.7); }
  50%      { box-shadow: 0 0 14px rgba(76,222,111,1);  }
}

#player-card .pc-identity {
  display: flex;
  flex-direction: column;
  gap: 5px;
  overflow: hidden;
  flex: 1;
}
#player-card .pc-name {
  font-family: 'vksans', monospace;
  font-size: 16px;
  color: #ffeada;
  text-shadow:
    0 0 12px rgba(255, 130, 40, 0.6),
    0 0 20px rgba(180, 100, 255, 0.5);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#player-card .pc-rank {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: 'vksans', monospace;
  font-size: 11px;
  color: #ffb35c;
  background: rgba(255, 130, 40, 0.16);
  border: 1px solid rgba(255, 130, 40, 0.38);
  border-radius: 6px;
  padding: 2px 8px;
  width: fit-content;
  max-width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#player-card .pc-rank::before {
  content: '★';
  font-size: 9px;
  color: #ff8c1a;
}

/* ── Нижняя секция: деньги + время ── */
#player-card .pc-stats {
  display: flex;
  align-items: stretch;
}
#player-card .pc-stat {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 12px 10px;
}
#player-card .pc-stat:first-child {
  border-right: 1px solid rgba(255, 130, 40, 0.22);
}
#player-card .pc-stat-label {
  font-family: 'vksans', monospace;
  font-size: 9px;
  color: rgba(255, 210, 170, 0.55);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
#player-card .pc-stat-value {
  font-family: 'vksans', monospace;
  font-size: 15px;
  font-weight: bold;
  color: #ffb35c;
  text-shadow: 0 0 10px rgba(255, 140, 50, 0.55);
}
#player-card .pc-stat:last-child .pc-stat-value {
  color: #ffb35c;
  text-shadow: 0 0 10px rgba(255, 140, 50, 0.55);
}

/* ── Плавающие кубы удалены — теперь искры снизу (см. script выше) ── */

</style>
</head>
<body>
  <!-- ═══ ПОЛОСА ЗАГРУЗКИ ═══ -->
  <div id="load-bar-wrap">
    <div class="lb-row">
      <span id="load-status">Загрузка</span><span id="dots"></span>
      <span id="load-percent">0%</span>
    </div>
    <div id="load-bar">
      <div id="loading-progress"></div>
    </div>
  </div>

  <!-- ═══ ЛОГОТИП (ВРЕМЕННО УБРАН — фон вместо него) ═══
  <div id="image-container">
    <img src="spirit_logo_5.png" class="center">
  </div>
  ═══════════════════════════════════════════════════════ -->

  <!-- ═══ ПЛАШКА ИГРОКА (скрыта, пока нет данных) ═══ -->
  <div id="player-card">
    <div class="pc-top">
      <div class="pc-avatar" id="pc-avatar" style="display:none;">
        <div id="pc-avatar-wrap"></div>
        <div class="pc-online-dot"></div>
      </div>
      <div class="pc-identity">
        <div class="pc-name" id="pc-name">—</div>
        <div class="pc-rank" id="pc-rank">—</div>
      </div>
    </div>
    <div class="pc-stats">
      <div class="pc-stat">
        <span class="pc-stat-label">Деньги</span>
        <span class="pc-stat-value" id="pc-wallet">—</span>
      </div>
      <div class="pc-stat">
        <span class="pc-stat-label">Наигранно</span>
        <span class="pc-stat-value" id="pc-job">—</span>
      </div>
    </div>
  </div>

  <script>
    // ── Анимация точек ──────────────────────────────────────────────────────
    var dotsElement = document.getElementById('dots');
    var dotCount = 0;
    function animateDots() {
      var dots = '';
      for (var i = 0; i < dotCount; i++) dots += '.';
      dotsElement.textContent = dots;
      dotCount = (dotCount + 1) % 4;
    }
    setInterval(animateDots, 1000);

    // ── Форматирование денег ────────────────────────────────────────────────
    function formatMoney(n) {
      n = parseInt(n) || 0;
      if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + ' млн';
      if (n >= 1000)    return (n / 1000).toFixed(1).replace(/\.0$/, '')    + ' к';
      return String(n);
    }

    // ── Плашка игрока ────────────────────────────────────────────────────────
    // Скрыта по умолчанию. Показывается ТОЛЬКО когда данные получены.
    // Если данных нет совсем — плашка остаётся скрытой.
    // Если какого-то поля не хватает — вместо него пишется "Неизвестно".
    var _cardShown = false;

    function hidePlayerCard() {
      document.getElementById('player-card').style.display = 'none';
    }

    function showPlayerCard(data) {
      // Игрока нет в базе (found === false) или данных совсем нет — плашку не показываем
      if (!data || data.found === false) { hidePlayerCard(); return; }

      // Нет ни одного осмысленного поля — плашку не показываем
      var hasAny = data.rpname || data.rank || data.playTime ||
                   data.wallet || data.wallet === 0 || data.avatar;
      if (!hasAny) { hidePlayerCard(); return; }

      function orUnknown(v) {
        return (v === undefined || v === null || v === '') ? 'Неизвестно' : v;
      }

      document.getElementById('pc-name').textContent   = orUnknown(data.rpname);
      document.getElementById('pc-rank').textContent   = orUnknown(data.rank);
      document.getElementById('pc-job').textContent    = orUnknown(data.playTime);
      document.getElementById('pc-wallet').textContent =
        (data.wallet === undefined || data.wallet === null) ? 'Неизвестно' : formatMoney(data.wallet);

      // Аватар — только если есть; иначе блок убираем (без плейсхолдеров)
      var avatarBox  = document.getElementById('pc-avatar');
      var avatarWrap = document.getElementById('pc-avatar-wrap');
      if (data.avatar) {
        avatarWrap.innerHTML = '<img src="' + data.avatar + '" alt="avatar">';
        avatarBox.style.display = '';
      } else {
        avatarWrap.innerHTML = '';
        avatarBox.style.display = 'none';
      }

      _cardShown = true;
      document.getElementById('player-card').style.display = 'flex';
    }

    function retryPlayerCard(attempt) {
      if (_cardShown) return;
      if (attempt < 3) {
        setTimeout(function () { loadPlayerCard(_pendingSteamId, attempt + 1); }, attempt * 2000);
      } else {
        hidePlayerCard(); // данных нет — просто убираем плашку
      }
    }

    function loadPlayerCard(steamid, attempt) {
      if (!steamid || steamid === '' || _cardShown) return;
      attempt = attempt || 1;

      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'https://loadscrin.vercel.app/api/player?steamid=' + encodeURIComponent(steamid), true);
      xhr.timeout = 12000;

      xhr.onreadystatechange = function() {
        if (xhr.readyState !== 4) return;

        if (xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            if (data && data.error) throw new Error(data.error);
            showPlayerCard(data);
            return;
          } catch (e) { /* некорректный ответ — ретрай ниже */ }
        }
        retryPlayerCard(attempt);
      };

      xhr.onerror   = function() { retryPlayerCard(attempt); };
      xhr.ontimeout = function() { retryPlayerCard(attempt); };

      xhr.send();
    }
    // ── Ждём steamid от GameDetails (опрос каждые 300мс, до 15 секунд) ──────
    var _cardLoaded = false;
    var _pollCount  = 0;
    var _pollTimer  = setInterval(function() {
      _pollCount++;
      if (_cardLoaded || _pollCount > 50) {
        clearInterval(_pollTimer);
        return;
      }
      if (typeof _pendingSteamId !== 'undefined' && _pendingSteamId) {
        _cardLoaded = true;
        clearInterval(_pollTimer);
        loadPlayerCard(_pendingSteamId);
      }
    }, 300);
  </script>

  <script src="lib/jquery-2.1.1.min.js"></script>
  <script src="lib/jquery.backstretch.min.js"></script>
  <script src="sleek.js"></script>

  <script>
// ── Искры, вылетающие снизу ─────────────────────────────────────────────────
(function() {
  var canvas = document.createElement('canvas');
  canvas.id = 'sparks';
  document.body.appendChild(canvas);
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0;
  var DPR = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function rand(a, b) { return a + Math.random() * (b - a); }

  var sparks = [];
  var MAX = 70;

  function spawn() {
    if (sparks.length >= MAX) return;
    sparks.push({
      x:      rand(0, W),
      y:      H + rand(0, 16),
      vx:     rand(-0.25, 0.25),
      vy:     -rand(0.8, 2.6),
      life:   0,
      maxLife: rand(70, 200),
      size:   rand(1, 2.6),
      // Хэллоуин: чередуем оранжевый и фиолетовый
      hue:    Math.random() < 0.5 ? rand(18, 38) : rand(255, 290)
    });
  }

  function tick() {
    requestAnimationFrame(tick);

    // Спавним несколько искр за кадр
    for (var i = 0; i < 3; i++) if (Math.random() < 0.55) spawn();

    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    for (var i = sparks.length - 1; i >= 0; i--) {
      var s = sparks[i];
      s.life++;
      if (s.life >= s.maxLife) { sparks.splice(i, 1); continue; }

      // Движение: вверх с затуханием + лёгкое дрожание вбок
      s.vy *= 0.995;
      s.x  += s.vx + Math.sin((s.life + i * 13) * 0.05) * 0.3;
      s.y  += s.vy;
      s.vx += rand(-0.02, 0.02);

      // Прозрачность: быстрый всплеск и плавное затухание
      var t = s.life / s.maxLife;
      var alpha = t < 0.15 ? t / 0.15 : 1 - (t - 0.15) / 0.85;

      // След (короткая линия по направлению скорости)
      ctx.strokeStyle = 'hsla(' + s.hue.toFixed(0) + ', 95%, 70%, ' + (alpha * 0.55).toFixed(3) + ')';
      ctx.lineWidth   = s.size;
      ctx.lineCap     = 'round';
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - s.vx * 4, s.y - s.vy * 4);
      ctx.stroke();

      // Яркое ядро искры
      ctx.fillStyle = 'hsla(' + s.hue.toFixed(0) + ', 100%, 88%, ' + alpha.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size * 0.6, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalCompositeOperation = 'source-over';
  }

  tick();
})();
</script>
</body>
</html>
